name: Build Emberfall Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract game 2.zip
        run: |
          if [ ! -f "game 2.zip" ]; then
            echo "ERROR: game 2.zip not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "game 2.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found!"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $ANDROID_DIR"

      - name: Make Gradle executable
        run: |
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Show generated APK
        run: |
          echo "Generated APK files:"
          find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-app-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
